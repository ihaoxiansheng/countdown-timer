<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简易倒计时</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 整个窗口就是一块可拖动区域:按住空白处即可挪动窗口,和 macOS 版一致 -->
    <div id="root" data-tauri-drag-region title="右键设置倒计时">
        <!-- 大号数字。等宽数字字体,字号由 JS 按窗口尺寸实时换算 -->
        <div id="time">00:00</div>

        <!-- 暂停时叠在数字正中的播放三角,表达"点一下继续" -->
        <svg id="play-glyph" viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="0,0 0,100 86,50" />
        </svg>

        <!-- 底部进度条:轨道常在,填充部分表示剩余比例 -->
        <div id="bar-track">
            <div id="bar-fill"></div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
