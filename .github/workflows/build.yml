name: Build Apps

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload macOS dmg (aarch64)
        if: matrix.platform == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v6
        with:
          name: macos-aarch64-dmg
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS dmg (x86_64)
        if: matrix.platform == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v6
        with:
          name: macos-x86_64-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS app (aarch64)
        if: matrix.platform == 'macos-latest' && matrix.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@v6
        with:
          name: macos-aarch64-app
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

      - name: Upload macOS app (x86_64)
        if: matrix.platform == 'macos-latest' && matrix.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@v6
        with:
          name: macos-x86_64-app
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app

      - name: Upload Windows installer
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

      - name: Upload Windows portable
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: src-tauri/target/x86_64-pc-windows-msvc/release/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      # GitHub Release 上传附件时会清洗掉文件名里的非 ASCII 字符,
      # 中文产品名(简易倒计时)生成的 "简易倒计时_1.0.0_aarch64.dmg"
      # 在下载列表里只会剩下 "_1.0.0_aarch64.dmg" 这种残缺名字。
      # 所以这里统一复制成 ASCII 文件名再上传,应用自身的显示名不受影响。
      - name: Rename artifacts to ASCII names
        run: |
          set -euo pipefail
          # 标签形如 v1.0.0,去掉前缀 v 得到版本号
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release

          # 取匹配到的第一个产物复制为指定名字;产物缺失时只告警,不中断发布
          copy_one() {
            local out="$1"
            shift
            if [ -e "$1" ]; then
              cp "$1" "release/${out}"
            else
              echo "::warning::缺少产物,已跳过: ${out}"
            fi
          }

          copy_one "SimpleCountdown_${version}_macos-aarch64.dmg" artifacts/macos-aarch64-dmg/*.dmg
          copy_one "SimpleCountdown_${version}_macos-x64.dmg"     artifacts/macos-x86_64-dmg/*.dmg
          copy_one "SimpleCountdown_${version}_windows-x64-setup.exe" artifacts/windows-installer/*.exe
          # 免安装版:直接是 release 目录下的主程序 exe,下载即可运行,不写注册表
          copy_one "SimpleCountdown_${version}_windows-x64-portable.exe" artifacts/windows-portable/*.exe

          ls -l release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: false
          generate_release_notes: true
